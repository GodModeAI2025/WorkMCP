[project]
name = "workmcp"
version = "0.1.0"
description = "MCP-Server für einen deutschen Job-Graphen: Stellenanzeigen (Arbeitsagentur, Arbeitnow), Berufe (BERUFENET, KldB 2010, ESCO, O*NET), Gehälter (Entgeltatlas), Automatisierungssignale (Hacker News) und Common Crawl – mit lokalem, versioniertem Gedächtnis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WorkMCP" }]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
workmcp = "workmcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workmcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
